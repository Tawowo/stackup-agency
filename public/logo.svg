<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" fill="none">
  <!-- S mark: two angled chevrons -->
  <!-- Top piece: navy, points/tapers to the right -->
  <polygon points="6,6 94,6 94,54 30,54" fill="#1E3A5F"/>
  <!-- Bottom piece: gold, points/tapers to the left -->
  <polygon points="6,66 70,66 94,114 6,114" fill="#F59E0B"/>

  <!-- "Stackup" text — bold, navy -->
  <text
    x="118" y="76"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-weight="800"
    font-size="62"
    fill="#1E3A5F"
    letter-spacing="-1"
  >Stackup</text>

  <!-- "AGENCY" text — lighter, tracked, navy -->
  <text
    x="122" y="106"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-weight="500"
    font-size="19"
    fill="#1E3A5F"
    letter-spacing="8"
  >AGENCY</text>
</svg>
